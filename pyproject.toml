[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "novigrad"
version = "0.1.1"
description = "Native Python bindings for the Novigrad software-defined Bionic NPU"
readme = "examples/python/README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "jioh jung", email = "jung@jioh.net"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: MacOS :: MacOS X",
]

[project.optional-dependencies]
mlx = ["mlx==0.32.2", "numpy>=2,<3", "safetensors>=0.8,<0.9"]

[project.urls]
Repository = "https://github.com/ziozzang/novigrad"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "bindings/python/python"
module-name = "novigrad._native"
