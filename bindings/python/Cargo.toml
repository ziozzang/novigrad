[package]
name = "novigrad-python"
version = "0.1.1"
edition = "2021"
publish = false
license = "MIT"
authors = ["jioh jung <jung@jioh.net>"]
description = "Native Python bindings for Novigrad"
repository = "https://github.com/ziozzang/novigrad"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
novi-core = { package = "novi", path = "../.." }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
tempfile = "3.27"
